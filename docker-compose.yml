version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: smart_logistics_pg
    environment:
      POSTGRES_DB: deals_bigdata
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d deals_bigdata"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: